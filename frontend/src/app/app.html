<div class="app-shell">
  <aside class="sidebar" [class.sidebar--open]="menuOpen()">
    <a class="brand" routerLink="/dashboard" (click)="closeMenu()" aria-label="Stock Manager home">
      <span class="brand__mark" aria-hidden="true">S</span>
      <span>
        <strong>Stock Manager</strong>
        <small>Trading workspace</small>
      </span>
    </a>

    <nav class="main-nav" aria-label="Main navigation">
      <span class="nav-eyebrow">Workspace</span>
      @for (item of navItems; track item.route) {
        <a
          [routerLink]="item.route"
          routerLinkActive="active"
          (click)="closeMenu()"
        >
          <app-icon [name]="item.icon" />
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>

    <div class="sidebar__footer">
      <span class="status-dot" aria-hidden="true"></span>
      <span>
        <strong>Local environment</strong>
        <small>API · localhost:8080</small>
      </span>
    </div>
  </aside>

  @if (menuOpen()) {
    <button class="scrim" type="button" aria-label="Close navigation" (click)="closeMenu()"></button>
  }

  <div class="workspace">
    <header class="topbar">
      <button
        class="icon-button mobile-menu"
        type="button"
        aria-label="Open navigation"
        [attr.aria-expanded]="menuOpen()"
        (click)="menuOpen.set(!menuOpen())"
      >
        <app-icon name="menu" />
      </button>
      <div class="topbar__context">
        <span class="topbar__pulse" aria-hidden="true"></span>
        <span>Market operations</span>
      </div>
      <div class="topbar__right">
        <span class="environment-pill">Development</span>
        <span class="avatar" aria-label="Administrator">AD</span>
      </div>
    </header>

    <main class="page-content" id="main-content">
      <router-outlet />
    </main>
  </div>
</div>
