spring.application.name=stock

# Load local database settings whether the app starts in backend/ or the repository root.
spring.config.import=optional:file:./.env[.properties],optional:file:./backend/.env[.properties]

# Database credentials come from .env or operating-system environment variables.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# The schema is created by sqlscript.sql, not Hibernate.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

server.port=${SERVER_PORT:8080}

# Swagger UI: http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
