spring.application.name=stock

# Load local database settings from backend/.env when it is present.
spring.config.import=optional:file:./.env[.properties]

# Database credentials come from .env or operating-system environment variables.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# The schema is created by sqlscript.sql, not Hibernate.
spring.jpa.hibernate.ddl-auto=none
